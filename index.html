<!DOCTYPE html>
<head>
<head>
<meta charset="UTF-8">
<!-- SECTION 1: without this, mobile browsers render at desktop width and zoom out -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Services Portal — Module 9 Demo</title>
<link rel="stylesheet" href="style.css">
</head>
</head>
<body>
    <!-- ============================================================
     SEMANTIC HEADER + RESPONSIVE NAV (Sections 3 & 4)
     ============================================================ -->
<header class="site-header">
  <div class="header-inner">
    <a href="#" class="brand">Student Services Portal</a>

    <!-- Accessible nav toggle: real <button>, aria-expanded kept in sync by app9.js -->
    <button class="nav-toggle" id="navToggle" aria-expanded="false" aria-controls="mainNav" aria-label="Toggle navigation menu">
      <span aria-hidden="true">&#9776;</span>
    </button>

    <nav class="main-nav" id="mainNav" aria-label="Main">
      <ul>
        <li><a href="#dashboard">Dashboard</a></li>
        <li><a href="#gallery">Gallery</a></li>
        <li><a href="#video">Video</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
  </div>
</header>
<main id="main">

  <!-- ============================================================
       HERO — responsive typography with clamp() (Section 1)
       ============================================================ -->
  <section class="hero">
    <h1>Welcome back, Jordan</h1>
    <p class="lead">Your courses, assessments and attendance — all in one responsive, accessible place.</p>
  </section>
  <section id="gallery" class="gallery-section" aria-labelledby="gallery-heading">
    <h2 id="gallery-heading">Campus Gallery</h2>
    <div class="gallery">
      <img
        src="https://picsum.photos/id/1015/800/600"
        srcset="https://picsum.photos/id/1015/400/300 400w,
                https://picsum.photos/id/1015/800/600 800w"
        sizes="(max-width: 600px) 100vw, 33vw"
        alt="Students studying together at a table in the campus library">
      <img
        src="https://picsum.photos/id/1025/800/600"
        srcset="https://picsum.photos/id/1025/400/300 400w,
                https://picsum.photos/id/1025/800/600 800w"
        sizes="(max-width: 600px) 100vw, 33vw"
        alt="Lecturer demonstrating a UX wireframe on a whiteboard">
      <img
        src="https://picsum.photos/id/1040/800/600"
        srcset="https://picsum.photos/id/1040/400/300 400w,
                https://picsum.photos/id/1040/800/600 800w"
        sizes="(max-width: 600px) 100vw, 33vw"
        alt="Graduating students celebrating outside the main campus building">
    </div>
  </section>
</main>

</body>
<!DOCTYPE html>
